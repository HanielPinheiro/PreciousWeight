services:
    mysql:
      container_name: precious-weight-mysql
      image: mysql:latest
      ports:
        - "3306:3306"
      expose:
        - "3306"
      environment:
        - MYSQL_USER=admin
        - MYSQL_PASSWORD=123
        - MYSQL_DATABASE=app_db
        - MYSQL_ROOT_PASSWORD=123
    postgres:
      container_name: precious-weight-postgres
      image: postgres:latest
      ports:
        - "5432:5432"
      expose:
        - "5432"
      environment:
        - POSTGRES_USER=admin
        - POSTGRES_PASSWORD=123
        - POSTGRES_DB=auth_db