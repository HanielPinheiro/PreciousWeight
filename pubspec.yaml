name: precious_weight
description: >-
  The app that make possible to monitor in real-time the data of baby scales
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  pretty_qr_code: ^3.3.0
  mobile_scanner: ^6.0.7
  flutter_esp_ble_prov: ^0.1.7

  intl: any
  flutter_native_splash: ^2.4.5
  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/


flutter_native_splash:
  color: "#ffffff"
  image: assets/imgs/logotipo.png
  branding: assets/imgs/logo.png
  color_dark: "#121212"
  image_dark: assets/imgs/logotipo.png
  branding_dark: assets/imgs/logo.png

  android_12:
    image: assets/imgs/logotipo.png
    icon_background_color: "#ffffff"
    image_dark: assets/imgs/logotipo.png
    icon_background_color_dark: "#121212"
    branding: assets/imgs/logo.png
    branding_dark: assets/imgs/logo.png

  web: false